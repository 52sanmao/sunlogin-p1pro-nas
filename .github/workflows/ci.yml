name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 冒烟测试 / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查
        run: python -m compileall -q app/server tests

      - name: 端到端冒烟测试
        run: python tests/smoke_test.py

  fpk:
    name: 打包 fpk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 这一步会在 Linux 上跑通完整的 fnpack 打包链路，
      # 顺带验证 cmd/ 脚本语法、LF 换行、manifest 与 config 的格式
      - name: fnpack build
        run: bash tools/build_fpk.sh

      - name: 检查产物结构
        run: |
          test -f p1pro.fpk
          tar -tzf p1pro.fpk | sort > /tmp/actual.txt
          cat /tmp/actual.txt
          for must in manifest ICON.PNG ICON_256.PNG app.tgz \
                      config/privilege config/resource \
                      cmd/main cmd/install_init cmd/install_callback \
                      wizard/install; do
            grep -qx "$must" /tmp/actual.txt || { echo "缺少 $must"; exit 1; }
          done

      - name: 检查脚本权限与换行
        run: |
          mkdir -p /tmp/x && tar -xzf p1pro.fpk -C /tmp/x
          for f in /tmp/x/cmd/*; do
            test -x "$f" || { echo "$f 没有可执行位"; exit 1; }
            if grep -q $'\r' "$f"; then echo "$f 含 CRLF"; exit 1; fi
          done
          echo "全部可执行且为 LF"

      - uses: actions/upload-artifact@v4
        with:
          name: p1pro-fpk
          path: p1pro.fpk
          if-no-files-found: error

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t p1pro-nas:ci .
      - name: 镜像内自检（无设备时应报错退出，而不是崩溃）
        run: |
          # --check 在连不上设备时故意返回 2，所以要先关掉 -e 才能取到退出码
          set +e
          docker run --rm --network host -e P1PRO_HOST=127.0.0.1 p1pro-nas:ci \
            python app.py --check
          code=$?
          set -e
          echo "退出码 $code（期望 2 = 连不上设备）"
          test "$code" -eq 2
      - name: 容器能起来并响应健康检查
        run: |
          docker run -d --name p1pro-ci --network host \
            -e P1PRO_HOST=127.0.0.1 -e P1PRO_PORT=18787 p1pro-nas:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18787/api/health > /dev/null; then
              echo "健康检查通过"; docker rm -f p1pro-ci; exit 0
            fi
            sleep 1
          done
          echo "健康检查超时"; docker logs p1pro-ci; exit 1
